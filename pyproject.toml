[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kiqfl"
version = "1.0.0"
description = "KAN-Enhanced Indirect Quantum Federated Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0.0",
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "matplotlib>=3.7.0",
  "scikit-learn>=1.3.0",
  "seaborn>=0.13.0",
  "pykan>=0.2.0",
  "qiskit>=1.4.0,<3.0.0",
  "pylatexenc>=2.10",
  "typing_extensions>=4.12.0",
  "opacus>=1.4.0",
]

[project.scripts]
kiqfl = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "webapp*"]
